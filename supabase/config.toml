[auth]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[functions.chat]
verify_jwt = false

[functions.deepsearch]
verify_jwt = false

[functions.elevenlabs-stt]
verify_jwt = false

[functions.gemini-tts]
verify_jwt = false

[functions.image-search]
verify_jwt = false

[functions.dialog-tts]
verify_jwt = false

# Браузерный WebSocket не может выставить заголовок Authorization, поэтому
# платформенная проверка JWT здесь выключена: функция сама валидирует токен
# пользователя из query-параметра через supabase.auth.getUser(token).
[functions.gemini-live]
verify_jwt = false

[functions.manga-analyze]
verify_jwt = false

# These endpoints enforce their own CAPTCHA, IP-rate-limit, or one-time
# high-entropy token checks; no end-user JWT is expected at the gateway.
[functions.submit-title]
verify_jwt = false

[functions.get-submission]
verify_jwt = false

[functions.login-confirm]
verify_jwt = false

# The proxy validates the caller JWT and administrator role inside the handler.
[functions.gemini-proxy]
verify_jwt = false

# Регистрация без письма: вызывается до появления сессии, anon-ключ публичный.
# Подтверждение почты делает сама функция (admin.createUser email_confirm=true).
[functions.auth-register]
verify_jwt = false
